name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@4e97ecde5048e1e0816923020652678063ffbf65 # v1
        with:
          ruby-version: '3.3'
      - name: Syntax check
        run: |
          ruby -c lib/empresta_comunidade.rb
          ruby -c lib/empresta_comunidade/gestao.rb
          ruby -c test/test_empresta_comunidade.rb
          ruby -c test/test_gestao.rb
          ruby -c test/test_csv_security.rb
      - name: Unit and integration tests
        run: ruby -Ilib -Itest -e 'Dir["test/test_*.rb"].sort.each { |file| require_relative file }'
